name: CD

on:
  push:
    branches: [dev, main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    # Native arm64 runner: the Lambdas run on arm64, so pip must fetch arm64 wheels (pydantic-core).
    runs-on: ubuntu-24.04-arm
    # A deploy stuck waiting on CloudFormation or ACM shouldn't burn the 6h default.
    timeout-minutes: 30
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    env:
      STAGE: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
      API_DOMAIN: ${{ vars.API_DOMAIN }}
      SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Serverless v4 packages Python deps via `poetry export`, which Poetry 2 ships as a plugin.
      - name: Install Poetry
        run: pip install poetry poetry-plugin-export

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # The serverless npm package is only a launcher; the framework itself is downloaded into ~/.serverless.
      - uses: actions/cache@v4
        with:
          path: ~/.serverless
          key: serverless-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Serverless and plugins
        run: pnpm install --frozen-lockfile

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy
        run: pnpm exec serverless deploy --stage "$STAGE" --region "$AWS_REGION" --verbose

      - name: Show API URL
        run: pnpm exec serverless info --stage "$STAGE" --region "$AWS_REGION"
