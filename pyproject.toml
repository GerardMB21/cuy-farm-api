[project]
name = "cuy-farm-api"
version = "0.1.0"
description = "Serverless API for managing cuy farm yards and movements"
requires-python = ">=3.12,<4.0"
dependencies = [
    "pydantic (>=2.0,<3.0)",
    "boto3 (>=1.34,<2.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
boto3-stubs = {extras = ["dynamodb"], version = "*"}

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
